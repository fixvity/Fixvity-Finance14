<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rent vs Buy Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --accent:#2563eb;
  --muted:#6b7280;
  --radius:14px;
  --shadow:0 10px 30px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:var(--bg);
}
.container{max-width:1200px;margin:auto;padding:20px}
h1{text-align:center;color:var(--accent)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:20px;
}
label{font-size:13px;color:var(--muted)}
input,select,button{
  width:100%;
  padding:10px;
  margin:6px 0 14px;
  border-radius:10px;
  border:1px solid #e5e7eb;
}
button{
  background:var(--accent);
  color:white;
  border:none;
  cursor:pointer;
}
button.secondary{
  background:#eef2ff;
  color:#111;
}
.results{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}
.result-box{
  background:#f8fafc;
  border-radius:12px;
  padding:14px;
  text-align:center;
}
.result-box h3{margin:0;color:var(--accent)}
canvas{margin-top:20px;height:260px!important}
@media(max-width:900px){
  .grid{grid-template-columns:1fr}
  .results{grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>
<div class="container">
<h1>Rent vs Buy Calculator</h1>

<div class="grid">

<!-- INPUT -->
<div class="card">
<label>Monthly Rent</label><input id="rent" value="1800">
<label>Annual Rent Increase (%)</label><input id="rentInc" value="3">
<label>Years Renting</label><input id="years" value="10">

<hr>

<label>Home Price</label><input id="price" value="350000">
<label>Down Payment</label><input id="down" value="70000">
<label>Mortgage Rate (%)</label><input id="rate" value="6.5">
<label>Loan Term (Years)</label><input id="term" value="30">
<label>Property Tax (Annual)</label><input id="tax" value="4200">
<label>Insurance (Annual)</label><input id="ins" value="1200">
<label>Maintenance (% of price)</label><input id="maint" value="1">
<label>Home Appreciation (%)</label><input id="app" value="3">
<label>Closing Costs</label><input id="close" value="8000">

<label><input type="checkbox" id="deduct" checked> Apply US Mortgage Tax Deduction</label>
<label>Marginal Tax Rate (%)</label><input id="taxRate" value="24">

<label>Currency</label>
<select id="cur">
<option value="$">$ USD</option>
<option value="€">€ EUR</option>
<option value="£">£ GBP</option>
</select>

<button onclick="calc()">Compare Rent vs Buy</button>
<button class="secondary" onclick="location.reload()">Clear</button>
</div>

<!-- OUTPUT -->
<div class="card">
<div class="results">
<div class="result-box"><h3 id="rentCost">$0</h3>Total Rent</div>
<div class="result-box"><h3 id="buyCost">$0</h3>Total Buy</div>
<div class="result-box"><h3 id="diff">$0</h3>Difference</div>
<div class="result-box"><h3 id="breakEven">–</h3>Break-Even</div>

<div class="result-box"><h3 id="equity">$0</h3>Equity</div>
<div class="result-box"><h3 id="value">$0</h3>Home Value</div>
<div class="result-box"><h3 id="net">$0</h3>Net Wealth</div>
<div class="result-box"><h3 id="irr">–</h3>IRR</div>
</div>

<canvas id="chart"></canvas>
</div>

</div>
</div>

<script>
let chart;

function fmt(n){
  return cur.value + Math.round(n).toLocaleString();
}

function calc(){
const y = +years.value;
const rent0 = +rent.value;
const rInc = +rentInc.value/100;

let rentTotal=0;
let rentArr=[];

for(let i=0;i<y;i++){
  rentTotal += rent0*Math.pow(1+rInc,i)*12;
  rentArr.push(rentTotal);
}

const loan0 = price.value - down.value;
const r = rate.value/100/12;
const n = term.value*12;
const emi = loan0 * r / (1 - Math.pow(1+r,-n));

let loan = loan0;
let interestPaid=0;
let buyTotal = +down.value + +close.value;
let buyArr=[];

for(let yr=1;yr<=y;yr++){
  let yearlyInt=0;
  for(let m=0;m<12;m++){
    let int = loan*r;
    yearlyInt += int;
    loan -= (emi - int);
  }
  interestPaid += yearlyInt;

  let yearlyCost = emi*12 + +tax.value + +ins.value + price.value*(maint.value/100);
  buyTotal += yearlyCost;
  buyArr.push(buyTotal);
}

let taxSave = deduct.checked ? (interestPaid + tax.value*y)*(taxRate.value/100) : 0;
buyTotal -= taxSave;

const homeVal = price.value*Math.pow(1+app.value/100,y);
const equityVal = homeVal - loan;
const netWealth = equityVal - buyTotal;

rentCost.innerText = fmt(rentTotal);
buyCost.innerText = fmt(buyTotal);
diff.innerText = fmt(rentTotal - buyTotal);
equity.innerText = fmt(equityVal);
value.innerText = fmt(homeVal);
net.innerText = fmt(netWealth);

breakEven.innerText = "Never";
for(let i=0;i<y;i++){
  if(rentArr[i]>=buyArr[i]){breakEven.innerText="Year "+(i+1);break;}
}

// IRR
let cf=[-(+down.value + +close.value)];
for(let i=0;i<y-1;i++) cf.push(-(buyArr[i]- (buyArr[i-1]||0)));
cf.push(homeVal - loan);

function IRR(cf){
 let r=0.1;
 for(let i=0;i<500;i++){
  let npv=0,d=0;
  for(let t=0;t<cf.length;t++){
    npv+=cf[t]/Math.pow(1+r,t);
    d-=t*cf[t]/Math.pow(1+r,t+1);
  }
  r-=npv/d;
 }
 return r;
}
irr.innerText = (IRR(cf)*100).toFixed(1)+"%";

// Chart
if(chart) chart.destroy();
const ctx=document.getElementById("chart").getContext("2d");
chart=new Chart(ctx,{
 type:"line",
 data:{
  labels:rentArr.map((_,i)=>"Year "+(i+1)),
  datasets:[
   {label:"Rent Cost",data:rentArr,borderColor:"#ef4444"},
   {label:"Buy Cost",data:buyArr,borderColor:"#2563eb"}
  ]
 },
 options:{responsive:true,maintainAspectRatio:false}
});
}
</script>
</body>
</html>
