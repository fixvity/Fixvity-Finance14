<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rent vs Buy Calculator</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:#f5f7fb;
}
.container{
  max-width:1250px;
  margin:30px auto;
  padding:16px;
}
h1{text-align:center;color:#2563eb}
.grid{
  display:grid;
  grid-template-columns:420px 1fr;
  gap:24px;
}
.card{
  background:#fff;
  border-radius:14px;
  padding:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.06);
}
label{font-size:14px;color:#6b7280;margin-top:10px;display:block}
input{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid #e5e7eb;
  margin-top:4px;
}
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  font-size:16px;
  margin-top:14px;
  cursor:pointer;
}
.primary{background:#2563eb;color:#fff}
.secondary{background:#eef2ff}

.results{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}
.box{
  background:#f9fafb;
  border-radius:12px;
  padding:14px;
  text-align:center;
}
.box h3{margin:0;color:#2563eb}
.box p{margin:4px 0 0;font-size:13px;color:#6b7280}

.roi{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-top:16px;
}

@media(max-width:900px){
  .grid{grid-template-columns:1fr}
  .results,.roi{grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>
<div class="container">
<h1>Rent vs Buy Calculator</h1>

<div class="grid">

<!-- INPUT -->
<div class="card">
<label>Monthly Rent</label><input id="rent" value="1800" type="number">
<label>Annual Rent Increase (%)</label><input id="rentInc" value="3" type="number">
<label>Years Renting</label><input id="years" value="10" type="number">

<hr>

<label>Home Price</label><input id="price" value="350000" type="number">
<label>Down Payment</label><input id="down" value="70000" type="number">
<label>Mortgage Rate (%)</label><input id="rate" value="6.5" type="number">
<label>Loan Term (Years)</label><input id="term" value="30" type="number">
<label>Property Tax (Annual)</label><input id="tax" value="4200" type="number">
<label>Insurance (Annual)</label><input id="ins" value="1200" type="number">
<label>Maintenance (% of price)</label><input id="maint" value="1" type="number">
<label>Home Appreciation (%)</label><input id="app" value="3" type="number">
<label>Closing Costs</label><input id="close" value="8000" type="number">

<button class="primary" onclick="calculate()">Compare Rent vs Buy</button>
<button class="secondary" onclick="location.reload()">Clear</button>
</div>

<!-- OUTPUT -->
<div class="card">

<div class="results">
  <div class="box"><h3 id="rentOut">$0</h3><p>Total Rent Cost</p></div>
  <div class="box"><h3 id="buyOut">$0</h3><p>Total Buy Cost</p></div>
  <div class="box"><h3 id="diffOut">$0</h3><p>Difference</p></div>
  <div class="box"><h3 id="breakOut">–</h3><p>Break-Even</p></div>
</div>

<!-- ROI -->
<div class="roi">
  <div class="box"><h3 id="equityOut">$0</h3><p>Equity Built</p></div>
  <div class="box"><h3 id="valueOut">$0</h3><p>Home Value</p></div>
  <div class="box"><h3 id="wealthOut">$0</h3><p>Net Wealth</p></div>
  <div class="box"><h3 id="roiOut">0%</h3><p>ROI</p></div>
</div>

<canvas id="chart" height="120" style="margin-top:20px"></canvas>

<button class="secondary" onclick="window.print()">Print Report</button>

</div>
</div>
</div>

<script>
let chart;

function calculate(){

  const rent = +rentInput();
  function rentInput(){return document.getElementById("rent").value}

  const rentInc = +document.getElementById("rentInc").value / 100;
  const years = +document.getElementById("years").value;
  const price = +document.getElementById("price").value;
  const down = +document.getElementById("down").value;
  const rate = +document.getElementById("rate").value / 100 / 12;
  const term = +document.getElementById("term").value * 12;
  const tax = +document.getElementById("tax").value;
  const ins = +document.getElementById("ins").value;
  const maint = +document.getElementById("maint").value / 100;
  const app = +document.getElementById("app").value / 100;
  const close = +document.getElementById("close").value;

  let rentArr=[], buyArr=[], labels=[];
  let rentTotal=0, r=rent;

  for(let y=1;y<=years;y++){
    rentTotal += r*12;
    rentArr.push(Math.round(rentTotal));
    r *= 1+rentInc;
    labels.push("Year "+y);
  }

  const loan = price - down;
  const emi = loan * rate * Math.pow(1+rate,term) / (Math.pow(1+rate,term)-1);

  let buyTotal = down + close;
  let balance = loan;
  let equity=down;
  let breakeven="Never";

  for(let y=1;y<=years;y++){
    let interestYear=0, principalYear=0;

    for(let m=0;m<12;m++){
      const i = balance * rate;
      const p = emi - i;
      balance -= p;
      interestYear += i;
      principalYear += p;
    }

    equity += principalYear;
    buyTotal += interestYear + tax + ins + price*maint;
    buyArr.push(Math.round(buyTotal));

    if(breakeven==="Never" && buyTotal<=rentTotal) breakeven=y;
  }

  const homeValue = price * Math.pow(1+app,years);
  const netWealth = homeValue - balance;

  document.getElementById("rentOut").innerText="$"+rentTotal.toLocaleString();
  document.getElementById("buyOut").innerText="$"+Math.round(buyTotal).toLocaleString();
  document.getElementById("diffOut").innerText="$"+Math.round(rentTotal-buyTotal).toLocaleString();
  document.getElementById("breakOut").innerText=breakeven==="Never"?"Never":"Year "+breakeven;
  document.getElementById("equityOut").innerText="$"+Math.round(equity).toLocaleString();
  document.getElementById("valueOut").innerText="$"+Math.round(homeValue).toLocaleString();
  document.getElementById("wealthOut").innerText="$"+Math.round(netWealth).toLocaleString();
  document.getElementById("roiOut").innerText=((netWealth/down)*100).toFixed(1)+"%";

  if(chart) chart.destroy();
  chart = new Chart(document.getElementById("chart"),{
    type:"line",
    data:{
      labels,
      datasets:[
        {label:"Rent Cost",data:rentArr,borderColor:"#ef4444",fill:false},
        {label:"Buy Cost",data:buyArr,borderColor:"#2563eb",fill:false}
      ]
    }
  });
}
</script>
</body>
</html>
