<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rent vs Buy Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:#f4f7fb;
}
.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}
h1{
  text-align:center;
  color:#2563eb;
}
.grid{
  display:grid;
  grid-template-columns: 380px 1fr;
  gap:20px;
}
.card{
  background:#fff;
  border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
  padding:20px;
}
label{
  font-size:13px;
  color:#555;
}
input,select{
  width:100%;
  padding:10px;
  margin:6px 0 14px;
  border-radius:8px;
  border:1px solid #ddd;
}
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-size:15px;
  cursor:pointer;
}
.results{
  display:grid;
  grid-template-columns: repeat(4,1fr);
  gap:12px;
}
.stat{
  background:#f8fafc;
  padding:12px;
  border-radius:10px;
  text-align:center;
}
.stat b{
  color:#2563eb;
}
canvas{
  margin-top:20px;
  height:300px !important;
}
@media(max-width:900px){
  .grid{grid-template-columns:1fr;}
  .results{grid-template-columns:1fr 1fr;}
}
</style>
</head>

<body>
<div class="container">
<h1>Rent vs Buy Calculator</h1>

<div class="grid">

<!-- INPUT -->
<div class="card">
<h3>Rent Details</h3>
<label>Monthly Rent</label>
<input id="rent" value="1800">

<label>Annual Rent Increase (%)</label>
<input id="rentInc" value="3">

<label>Years Renting</label>
<input id="years" value="10">

<hr>

<h3>Buy Details</h3>
<label>Home Price</label>
<input id="price" value="350000">

<label>Down Payment</label>
<input id="down" value="70000">

<label>Mortgage Rate (%)</label>
<input id="rate" value="6.5">

<label>Loan Term (Years)</label>
<input id="term" value="30">

<label>Property Tax (Annual)</label>
<input id="tax" value="4200">

<label>Insurance (Annual)</label>
<input id="ins" value="1200">

<label>Maintenance (% of price)</label>
<input id="maint" value="1">

<label>Home Appreciation (%)</label>
<input id="app" value="3">

<label>Closing Costs</label>
<input id="close" value="8000">

<button onclick="calculate()">Compare Rent vs Buy</button>
</div>

<!-- OUTPUT -->
<div class="card">
<div class="results">
<div class="stat"><b id="rentTotal">$0</b><br>Total Rent</div>
<div class="stat"><b id="buyTotal">$0</b><br>Total Buy Cost</div>
<div class="stat"><b id="diff">$0</b><br>Difference</div>
<div class="stat"><b id="break">—</b><br>Break-Even</div>

<div class="stat"><b id="equity">$0</b><br>Equity</div>
<div class="stat"><b id="value">$0</b><br>Home Value</div>
<div class="stat"><b id="wealth">$0</b><br>Net Wealth</div>
<div class="stat"><b id="roi">0%</b><br>ROI</div>
</div>

<canvas id="chart"></canvas>
</div>

</div>
</div>

<script>
let chart;

function fmt(n){
  return "$" + Math.round(n).toLocaleString();
}

function calculate(){
  const rent = +rent.value;
  const rentInc = +rentInc.value/100;
  const years = +years.value;

  const price = +price.value;
  const down = +down.value;
  const rate = +rate.value/100/12;
  const term = +term.value*12;
  const tax = +tax.value;
  const ins = +ins.value;
  const maint = +maint.value/100;
  const app = +app.value/100;
  const close = +close.value;

  let rentTotal = 0;
  let rentYear = rent;

  let rentArr=[], buyArr=[], labels=[];
  let loan = price - down;
  let value = price;

  const mPay = loan * rate / (1 - Math.pow(1+rate,-term));
  let buyCash = down + close;
  let principalPaid = 0;

  for(let y=1;y<=years;y++){
    rentTotal += rentYear*12;
    rentArr.push(rentTotal);
    rentYear *= (1+rentInc);

    let yearlyMortgage = mPay*12;
    let interest = loan*rate*12;
    let principal = yearlyMortgage - interest;
    loan -= principal;
    principalPaid += principal;

    let yearlyBuy = yearlyMortgage + tax + ins + price*maint;
    buyCash += yearlyBuy;

    value *= (1+app);
    buyArr.push(buyCash);
    labels.push("Year "+y);
  }

  const equity = value - loan;
  const netWealth = equity - (buyCash - down);
  const roi = (netWealth / buyCash) * 100;

  rentTotalEl.innerText = fmt(rentTotal);
  buyTotal.innerText = fmt(buyCash);
  diff.innerText = fmt(rentTotal - buyCash);
  equityEl.innerText = fmt(equity);
  valueEl.innerText = fmt(value);
  wealthEl.innerText = fmt(netWealth);
  roiEl.innerText = roi.toFixed(1)+"%";
  breakEl.innerText = "Never";

  if(chart) chart.destroy();
  chart = new Chart(chartCtx,{
    type:"line",
    data:{
      labels,
      datasets:[
        {label:"Rent Cost",data:rentArr,borderColor:"#dc2626"},
        {label:"Buy Cost",data:buyArr,borderColor:"#2563eb"}
      ]
    },
    options:{responsive:true,maintainAspectRatio:false}
  });
}
</script>
</body>
</html>
