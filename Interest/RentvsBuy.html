<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rent vs Buy Calculator</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --accent:#2f6ce5;
  --muted:#6b7280;
  --radius:14px;
  --shadow:0 10px 30px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:var(--bg);
  color:#111;
}
h1{
  text-align:center;
  color:var(--accent);
  margin:24px 0;
}
.container{
  max-width:1200px;
  margin:auto;
  padding:16px;
}
.grid{
  display:grid;
  grid-template-columns:380px 1fr;
  gap:20px;
}
.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:18px;
}
label{
  font-size:13px;
  color:var(--muted);
}
input,select{
  width:100%;
  padding:10px;
  border:1px solid #e5e7eb;
  border-radius:10px;
  margin-bottom:12px;
  font-size:14px;
}
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  font-size:15px;
  cursor:pointer;
}
.primary{background:var(--accent);color:#fff}
.secondary{background:#eef2ff;color:#333;margin-top:8px}
.results{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}
.result-box{
  background:#f8fafc;
  border-radius:12px;
  padding:14px;
  text-align:center;
}
.result-box b{
  font-size:18px;
  color:var(--accent);
}
canvas{margin-top:20px}
@media(max-width:900px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<h1>Rent vs Buy Calculator</h1>

<div class="container">
<div class="grid">

<!-- INPUTS -->
<div class="card">

<b>Rent Details</b><br><br>

<label>Monthly Rent</label>
<input id="rent" value="1800">

<label>Annual Rent Increase (%)</label>
<input id="rentInc" value="3">

<label>Years Renting</label>
<input id="years" value="10">

<hr>

<b>Buy Details</b><br><br>

<label>Home Price</label>
<input id="price" value="350000">

<label>Down Payment</label>
<input id="down" value="70000">

<label>Mortgage Rate (%)</label>
<input id="rate" value="6.5">

<label>Loan Term (Years)</label>
<input id="term" value="30">

<label>Property Tax (Annual)</label>
<input id="tax" value="4200">

<label>Insurance (Annual)</label>
<input id="ins" value="1200">

<label>Maintenance (% of price)</label>
<input id="maint" value="1">

<label>Home Appreciation (%)</label>
<input id="app" value="3">

<label>Closing Costs</label>
<input id="close" value="8000">

<label>Currency</label>
<select id="cur">
  <option value="$">$ USD</option>
  <option value="€">€ EUR</option>
  <option value="£">£ GBP</option>
</select>

<button class="primary" onclick="calculate()">Compare Rent vs Buy</button>
<button class="secondary" onclick="location.reload()">Clear</button>

</div>

<!-- RESULTS -->
<div class="card">

<div class="results">
  <div class="result-box"><b id="rRent">$0</b><div>Total Rent</div></div>
  <div class="result-box"><b id="rBuy">$0</b><div>Total Buy</div></div>
  <div class="result-box"><b id="rDiff">$0</b><div>Difference</div></div>
  <div class="result-box"><b id="rBE">–</b><div>Break-Even</div></div>

  <div class="result-box"><b id="rEq">$0</b><div>Equity</div></div>
  <div class="result-box"><b id="rVal">$0</b><div>Home Value</div></div>
  <div class="result-box"><b id="rNW">$0</b><div>Net Wealth</div></div>
  <div class="result-box"><b id="rROI">0%</b><div>ROI</div></div>
</div>

<canvas id="chart" height="260"></canvas>

</div>
</div>
</div>

<script>
let chart;

function calculate(){
const $ = id => +document.getElementById(id).value;
const cur = document.getElementById("cur").value;

const rent0 = $("rent");
const rentInc = $("rentInc")/100;
const years = $("years");

const price = $("price");
const down = $("down");
const rate = $("rate")/100;
const term = $("term")*12;
const tax = $("tax");
const ins = $("ins");
const maint = $("maint")/100*price;
const app = $("app")/100;
const close = $("close");

let rentTotal=0;
let rentYear=rent0;
let rentArr=[], buyArr=[];

// Calculate total rent over years
for(let y=1;y<=years;y++){
  rentTotal+=rentYear*12;
  rentArr.push(rentTotal);
  rentYear*=1+rentInc;
}

// Calculate mortgage payment
const loan = price-down;
const monthlyRate = rate/12;
const mPay = loan * (monthlyRate * Math.pow(1+monthlyRate,term)) / (Math.pow(1+monthlyRate,term)-1);

// Simulate mortgage payments
let balance=loan;
let buyTotal=down + close; // Include closing costs upfront
let principalPaid=0;

for(let m=1;m<=years*12;m++){
  const interest=balance*monthlyRate;
  const principal=mPay-interest;
  balance-=principal;
  if(balance<0) balance=0;
  principalPaid+=principal;
  buyTotal+=mPay;
  if(m%12===0){
    buyTotal+=tax+ins+maint;
    buyArr.push(buyTotal);
  }
}

// Final calculations
const homeValue = price*Math.pow(1+app,years);
const equity = Math.max(0, homeValue-balance);
const netWealth = equity - (buyTotal - down); // Total costs minus down payment (already in equity)
const roi = down > 0 ? ((equity - down)/down)*100 : 0;

document.getElementById("rRent").innerText=cur+rentTotal.toLocaleString();
document.getElementById("rBuy").innerText=cur+buyTotal.toLocaleString();
document.getElementById("rDiff").innerText=cur+(rentTotal-buyTotal).toLocaleString();
document.getElementById("rEq").innerText=cur+equity.toLocaleString();
document.getElementById("rVal").innerText=cur+homeValue.toLocaleString();
document.getElementById("rNW").innerText=cur+netWealth.toLocaleString();
document.getElementById("rROI").innerText=roi.toFixed(1)+"%";
document.getElementById("rBE").innerText=rentTotal>buyTotal?"Year "+years:"Never";

if(chart) chart.destroy();
chart=new Chart(document.getElementById("chart"),{
  type:"line",
  data:{
    labels:[...Array(years)].map((_,i)=>"Year "+(i+1)),
    datasets:[
      {label:"Rent Cost",data:rentArr,borderColor:"#dc2626",fill:false},
      {label:"Buy Cost",data:buyArr,borderColor:"#2563eb",fill:false}
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false
  }
});
}
</script>

</body>
</html>
