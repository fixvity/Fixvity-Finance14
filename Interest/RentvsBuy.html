<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rent vs Buy Calculator</title>

<style>
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --primary:#2563eb;
  --muted:#6b7280;
  --border:#e5e7eb;
  --radius:14px;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;
  color:#111827;
}

.container{
  max-width:1200px;
  margin:30px auto;
  padding:16px;
}

h1{
  text-align:center;
  color:#2563eb;
  margin-bottom:20px;
}

.calculator-grid{
  display:grid;
  grid-template-columns:420px 1fr;
  gap:24px;
  align-items:start;
}

.card{
  background:var(--card);
  border-radius:var(--radius);
  padding:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.06);
}

.section-title{
  font-weight:700;
  margin:14px 0 10px;
}

label{
  font-size:14px;
  color:var(--muted);
  display:block;
  margin-bottom:4px;
}

input{
  width:100%;
  padding:10px 12px;
  border-radius:10px;
  border:1px solid var(--border);
  margin-bottom:12px;
  font-size:15px;
}

button{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
}

.btn-primary{
  background:var(--primary);
  color:white;
}

.btn-secondary{
  background:#eef2ff;
  margin-top:10px;
}

.results-panel{
  display:flex;
  flex-direction:column;
}

.results-cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.result-box{
  background:#f9fafb;
  border-radius:12px;
  padding:14px;
  text-align:center;
}

.result-box h3{
  margin:0;
  color:var(--primary);
}

.result-box p{
  margin:4px 0 0;
  font-size:13px;
  color:var(--muted);
}

.print-btn{
  margin-top:20px;
  background:#eef2ff;
}

@media(max-width:900px){
  .calculator-grid{grid-template-columns:1fr}
  .results-cards{grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>
<div class="container">
<h1>Rent vs Buy Calculator</h1>

<div class="calculator-grid">

<!-- LEFT -->
<div class="card">
  <div class="section-title">Rent Details</div>

  <label>Monthly Rent</label>
  <input id="rent" type="number" value="1800">

  <label>Annual Rent Increase (%)</label>
  <input id="rentInc" type="number" value="3">

  <label>Years Renting</label>
  <input id="years" type="number" value="10">

  <div class="section-title">Buy Details</div>

  <label>Home Price</label>
  <input id="price" type="number" value="350000">

  <label>Down Payment</label>
  <input id="down" type="number" value="70000">

  <label>Mortgage Rate (%)</label>
  <input id="rate" type="number" value="6.5">

  <label>Loan Term (Years)</label>
  <input id="term" type="number" value="30">

  <label>Property Tax (Annual)</label>
  <input id="tax" type="number" value="4200">

  <label>Insurance (Annual)</label>
  <input id="ins" type="number" value="1200">

  <label>Maintenance (% of price)</label>
  <input id="maint" type="number" value="1">

  <label>Home Appreciation (%)</label>
  <input id="app" type="number" value="3">

  <label>Closing Costs</label>
  <input id="close" type="number" value="8000">

  <button class="btn-primary" onclick="calculate()">Compare Rent vs Buy</button>
  <button class="btn-secondary" onclick="location.reload()">Clear</button>
</div>

<!-- RIGHT -->
<div class="card results-panel">
  <div class="results-cards">
    <div class="result-box">
      <h3 id="rentTotal">$0</h3>
      <p>Total Rent Cost</p>
    </div>
    <div class="result-box">
      <h3 id="buyTotal">$0</h3>
      <p>Total Buy Cost</p>
    </div>
    <div class="result-box">
      <h3 id="diff">$0</h3>
      <p>Difference</p>
    </div>
    <div class="result-box">
      <h3 id="breakeven">–</h3>
      <p>Break-Even Year</p>
    </div>
  </div>

  <button class="print-btn" onclick="window.print()">Print Report</button>
</div>

</div>
</div>

<script>
function calculate(){
  const rent = +rent.value;
  const rentInc = +rentIncInput.value || +document.getElementById("rentInc").value;
  const years = +yearsInput.value || +document.getElementById("years").value;
  const price = +priceInput.value || +document.getElementById("price").value;
  const down = +downInput.value || +document.getElementById("down").value;
  const rate = +rateInput.value || +document.getElementById("rate").value;
  const term = +termInput.value || +document.getElementById("term").value;
  const tax = +taxInput.value || +document.getElementById("tax").value;
  const ins = +insInput.value || +document.getElementById("ins").value;
  const maint = +maintInput.value || +document.getElementById("maint").value;
  const app = +appInput.value || +document.getElementById("app").value;
  const close = +closeInput.value || +document.getElementById("close").value;

  // RENT TOTAL
  let totalRent = 0;
  let currRent = rent;
  for(let i=1;i<=years;i++){
    totalRent += currRent * 12;
    currRent *= (1 + rentInc/100);
  }

  // MORTGAGE
  const loan = price - down;
  const r = rate/100/12;
  const n = term*12;
  const emi = loan * r * Math.pow(1+r,n) / (Math.pow(1+r,n)-1);

  let buyCost = down + close;
  let balance = loan;
  let equity = down;
  let breakeven = "Never";

  for(let y=1;y<=years;y++){
    let interestYear = 0;
    let principalYear = 0;

    for(let m=0;m<12;m++){
      const interest = balance * r;
      const principal = emi - interest;
      balance -= principal;
      interestYear += interest;
      principalYear += principal;
    }

    buyCost += interestYear + tax + ins + (price * maint/100);
    equity += principalYear;
    equity += price * app/100;

    if(breakeven === "Never" && buyCost <= totalRent){
      breakeven = y;
    }
  }

  document.getElementById("rentTotal").innerText = `$${Math.round(totalRent).toLocaleString()}`;
  document.getElementById("buyTotal").innerText = `$${Math.round(buyCost).toLocaleString()}`;
  document.getElementById("diff").innerText =
    `$${Math.round(totalRent - buyCost).toLocaleString()}`;
  document.getElementById("breakeven").innerText =
    breakeven === "Never" ? "Never" : `Year ${breakeven}`;
}
</script>
</body>
</html>
