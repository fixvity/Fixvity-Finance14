<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rent vs Buy Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --accent:#2563eb;
  --muted:#6b7280;
  --radius:14px;
  --shadow:0 10px 30px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:var(--bg);
}
.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}
h1{
  text-align:center;
  color:var(--accent);
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}
.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:20px;
}
label{
  font-size:13px;
  color:var(--muted);
}
input,select,button{
  width:100%;
  padding:10px;
  margin:6px 0 14px;
  border-radius:10px;
  border:1px solid #e5e7eb;
}
button{
  background:var(--accent);
  color:#fff;
  border:none;
  cursor:pointer;
}
button.secondary{
  background:#eef2ff;
  color:#111;
}
.results{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}
.result{
  background:#f8fafc;
  border-radius:12px;
  padding:14px;
  text-align:center;
}
.result h3{
  margin:0;
  color:var(--accent);
}
canvas{
  height:260px !important;
  margin-top:20px;
}
@media(max-width:900px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>
<div class="container">
<h1>Rent vs Buy Calculator</h1>

<div class="grid">

<!-- INPUT -->
<div class="card">
<label>Monthly Rent</label>
<input id="rent" value="1800">

<label>Annual Rent Increase (%)</label>
<input id="rentInc" value="3">

<label>Years</label>
<input id="years" value="10">

<hr>

<label>Home Price</label>
<input id="price" value="350000">

<label>Down Payment</label>
<input id="down" value="70000">

<label>Mortgage Rate (%)</label>
<input id="rate" value="6.5">

<label>Loan Term (Years)</label>
<input id="term" value="30">

<label>Property Tax (Annual)</label>
<input id="tax" value="4200">

<label>Insurance (Annual)</label>
<input id="ins" value="1200">

<label>Maintenance (% of price)</label>
<input id="maint" value="1">

<label>Home Appreciation (%)</label>
<input id="app" value="3">

<label>Closing Costs</label>
<input id="close" value="8000">

<label>Currency</label>
<select id="cur">
  <option value="$">$ USD</option>
  <option value="€">€ EUR</option>
  <option value="£">£ GBP</option>
</select>

<button onclick="calculate()">Compare Rent vs Buy</button>
<button class="secondary" onclick="location.reload()">Clear</button>
</div>

<!-- OUTPUT -->
<div class="card">
<div class="results">
  <div class="result"><h3 id="rRent">$0</h3><small>Total Rent</small></div>
  <div class="result"><h3 id="rBuy">$0</h3><small>Total Buy</small></div>
  <div class="result"><h3 id="rDiff">$0</h3><small>Difference</small></div>
  <div class="result"><h3 id="rBE">–</h3><small>Break-Even</small></div>

  <div class="result"><h3 id="rEq">$0</h3><small>Equity</small></div>
  <div class="result"><h3 id="rVal">$0</h3><small>Home Value</small></div>
  <div class="result"><h3 id="rNet">$0</h3><small>Net Wealth</small></div>
</div>

<canvas id="chart"></canvas>
</div>

</div>
</div>

<script>
let chart;

function money(v){
  return cur.value + Math.round(v).toLocaleString();
}

function calculate(){

const Y = +years.value;
const rent0 = +rent.value;
const rentInc = +rentInc.value/100;

const price = +price.value;
const down = +down.value;
const rate = +rate.value/100;
const term = +term.value;
const tax = +tax.value;
const ins = +ins.value;
const maint = +maint.value/100;
const app = +app.value/100;
const close = +close.value;

/* RENT */
let rentTotal = 0;
let rentArr = [];
for(let y=1;y<=Y;y++){
  rentTotal += rent0*Math.pow(1+rentInc,y-1)*12;
  rentArr.push(rentTotal);
}

/* MORTGAGE */
const loan0 = price - down;
const r = rate/12;
const n = term*12;
const emi = loan0*r/(1-Math.pow(1+r,-n));

let loan = loan0;
let buyTotal = down + close;
let buyArr = [];

for(let y=1;y<=Y;y++){
  for(let m=0;m<12;m++){
    if(loan<=0) break;
    let interest = loan*r;
    let principal = Math.min(emi-interest,loan);
    loan -= principal;
  }
  buyTotal += emi*12 + tax + ins + price*maint;
  buyArr.push(buyTotal);
}

/* HOME */
const homeValue = price*Math.pow(1+app,Y);
const equity = homeValue - Math.max(loan,0);
const net = equity - buyTotal;

/* OUTPUT */
rRent.innerText = money(rentTotal);
rBuy.innerText = money(buyTotal);
rDiff.innerText = money(rentTotal-buyTotal);
rEq.innerText = money(equity);
rVal.innerText = money(homeValue);
rNet.innerText = money(net);

/* BREAK EVEN */
rBE.innerText="Never";
for(let i=0;i<Y;i++){
  if(rentArr[i]>=buyArr[i]){
    rBE.innerText="Year "+(i+1);
    break;
  }
}

/* CHART */
if(chart) chart.destroy();
chart = new Chart(chart,{
  type:"line",
  data:{
    labels:rentArr.map((_,i)=>"Year "+(i+1)),
    datasets:[
      {label:"Rent Cost",data:rentArr,borderColor:"#ef4444"},
      {label:"Buy Cost",data:buyArr,borderColor:"#2563eb"}
    ]
  },
  options:{
    responsive:true,
    maintainAspectRatio:false
  }
});
}
</script>
</body>
</html>
