<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rent vs Buy Calculator</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --accent:#2f6ce5;
  --success:#10b981;
  --danger:#ef4444;
  --muted:#6b7280;
  --radius:14px;
  --shadow:0 10px 30px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:var(--bg);
  color:#111;
}
h1{text-align:center;color:var(--accent);margin:24px 0}
.container{max-width:1200px;margin:auto;padding:16px}
.grid{display:grid;grid-template-columns:380px 1fr;gap:24px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px}

.section{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #eef2f7}
.section:last-child{border:none}
.section h3{margin:0 0 14px;color:var(--accent)}

label{font-size:13px;color:var(--muted);margin-bottom:6px;display:block}
input,select{width:100%;padding:12px;border-radius:10px;border:1.8px solid #e5e7eb;margin-bottom:14px}

button{width:100%;padding:14px;border:none;border-radius:12px;font-weight:600;cursor:pointer}
.primary{background:var(--accent);color:#fff}
.secondary{background:#eef2ff;color:#111;margin-top:10px}

.results{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.result-box{background:#f8fafc;border-radius:12px;padding:16px;text-align:center}
.result-box.positive{border:2px solid var(--success)}
.result-box.negative{border:2px solid var(--danger)}
.result-box b{font-size:20px;display:block}
.result-box small{color:var(--muted);font-size:12px}

.verdict{
  background:#f1f5f9;
  border-radius:12px;
  padding:14px;
  text-align:center;
  margin-bottom:16px;
  font-weight:600;
}

.chart-wrap{height:300px}

@media(max-width:900px){
  .grid{grid-template-columns:1fr}
  .results{grid-template-columns:repeat(2,1fr)}
  .card{padding:18px}
}
</style>
</head>

<body>
<h1>🏠 Rent vs Buy Calculator</h1>

<div class="container">
<div class="grid">

<!-- INPUT -->
<div class="card">
<div class="section">
<h3>Rent</h3>
<label>Monthly Rent</label>
<input id="rent" value="1800">
<label>Rent Increase %</label>
<input id="rentInc" value="3">
<label>Investment Return %</label>
<input id="rentInvest" value="5">
</div>

<div class="section">
<h3>Buy</h3>
<label>Home Price</label>
<input id="price" value="350000">
<label>Down Payment</label>
<input id="down" value="70000">
<label>Mortgage Rate %</label>
<input id="rate" value="6.5">
<label>Loan Term (years)</label>
<input id="term" value="30">
</div>

<div class="section">
<h3>Costs</h3>
<label>Property Tax (annual)</label>
<input id="tax" value="4200">
<label>Insurance (annual)</label>
<input id="ins" value="1200">
<label>Maintenance %</label>
<input id="maint" value="1">
<label>Closing Costs</label>
<input id="close" value="8000">
</div>

<div class="section">
<h3>Growth</h3>
<label>Home Appreciation %</label>
<input id="app" value="3">
<label>Years</label>
<input id="years" value="10">
</div>

<button class="primary" onclick="calculate()">Calculate</button>
<button class="secondary" onclick="location.reload()">Reset</button>
</div>

<!-- OUTPUT -->
<div class="card">

<div class="verdict" id="verdict">Best Option: —</div>

<div class="results">
<div class="result-box" id="rentBox"><b id="rRent">$0</b><small>Total Rent</small></div>
<div class="result-box" id="buyBox"><b id="rBuy">$0</b><small>Total Buy Cost</small></div>
<div class="result-box" id="diffBox"><b id="rDiff">$0</b><small>Rent − Buy</small></div>
<div class="result-box" id="eqBox"><b id="rEq">$0</b><small>Final Equity</small></div>
</div>

<div class="results">
<div class="result-box"><b id="mRent">$0</b><small>Avg Monthly Rent</small></div>
<div class="result-box"><b id="mBuy">$0</b><small>Avg Monthly Buy</small></div>
<div class="result-box"><b id="breakEven">Never</b><small>Break-Even Year</small></div>
<div class="result-box"><b id="homeVal">$0</b><small>Home Value</small></div>
</div>

<div class="chart-wrap">
<canvas id="chart"></canvas>
</div>

</div>
</div>
</div>

<script>
let chart;
const $=id=>+document.getElementById(id).value||0;
const money=n=>"$"+Math.round(n).toLocaleString();

function calculate(){
let rent=$("rent"), rentInc=$("rentInc")/100;
let price=$("price"), down=$("down"), rate=$("rate")/100/12;
let term=$("term")*12, tax=$("tax"), ins=$("ins"), maint=$("maint")/100;
let close=$("close"), app=$("app")/100, years=$("years");

let rentTotal=0, rentData=[], buyData=[];
let annualRent=rent*12;

for(let y=1;y<=years;y++){
 rentTotal+=annualRent;
 rentData.push(rentTotal);
 annualRent*=1+rentInc;
}

let loan=price-down;
let mPay=loan*(rate*Math.pow(1+rate,term))/(Math.pow(1+rate,term)-1);
let balance=loan, buyTotal=down+close;

for(let y=1;y<=years;y++){
 for(let m=0;m<12;m++){
  let interest=balance*rate;
  balance=Math.max(0,balance-(mPay-interest));
  buyTotal+=mPay;
 }
 buyTotal+=tax+ins+(price*maint);
 buyData.push(buyTotal);
}

let homeValue=price*Math.pow(1+app,years);
let equity=homeValue-balance;

document.getElementById("rRent").textContent=money(rentTotal);
document.getElementById("rBuy").textContent=money(buyTotal);
document.getElementById("rDiff").textContent=money(rentTotal-buyTotal);
document.getElementById("rEq").textContent=money(equity);
document.getElementById("homeVal").textContent=money(homeValue);

document.getElementById("mRent").textContent=money(rentTotal/(years*12));
document.getElementById("mBuy").textContent=money(buyTotal/(years*12));

let verdict = rentTotal < buyTotal ? "Rent is better" : "Buying is better";
document.getElementById("verdict").textContent="Best Option: "+verdict;

let be="Never";
for(let i=0;i<years;i++){
 if(rentData[i]>=buyData[i]){be="Year "+(i+1);break}
}
document.getElementById("breakEven").textContent=be;

if(chart) chart.destroy();
chart=new Chart(chart,{
 type:"line",
 data:{labels:rentData.map((_,i)=>"Year "+(i+1)),
 datasets:[
  {label:"Rent Cost",data:rentData,borderColor:"#ef4444",tension:.3},
  {label:"Buy Cost",data:buyData,borderColor:"#3b82f6",tension:.3}
 ]},
 options:{
  responsive:true,
  maintainAspectRatio:false,
  scales:{y:{ticks:{callback:v=>"$"+v.toLocaleString()}}}
 }
});
}
calculate();
</script>
</body>
</html>
