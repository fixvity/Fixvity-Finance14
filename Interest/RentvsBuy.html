<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perfect Rent vs Buy Calculator</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --accent:#2f6ce5;
  --success:#10b981;
  --danger:#ef4444;
  --muted:#6b7280;
  --radius:14px;
  --shadow:0 10px 30px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:var(--bg);
  color:#111;
  line-height:1.5;
}
h1{
  text-align:center;
  color:var(--accent);
  margin:24px 0;
  font-size:2.2em;
  font-weight:700;
}
.container{
  max-width:1200px;
  margin:auto;
  padding:16px;
}
.grid{
  display:grid;
  grid-template-columns:380px 1fr;
  gap:24px;
}
.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:24px;
}
label{
  display:block;
  font-size:13px;
  color:var(--muted);
  margin-bottom:6px;
  font-weight:500;
}
input,select{
  width:100%;
  padding:12px;
  border:2px solid #e5e7eb;
  border-radius:10px;
  margin-bottom:16px;
  font-size:14px;
  transition:border-color .2s;
}
input:focus,select:focus{outline:none;border-color:var(--accent)}
.section{margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid #f1f5f9}
.section:last-child{border-bottom:none}
.section h3{margin:0 0 16px 0;color:var(--accent);font-size:1.1em}
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  transition:transform .2s;
}
.primary{background:var(--accent);color:#fff}
.primary:hover{transform:translateY(-1px)}
.secondary{background:#f1f5f9;color:#374151;margin-top:12px}
.results{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-bottom:24px;
}
.result-box{
  background:linear-gradient(135deg,#f8fafc,#f1f5f9);
  border-radius:12px;
  padding:20px 16px;
  text-align:center;
  border:2px solid transparent;
  transition:all .3s;
}
.result-box.positive{ border-color:var(--success); background:linear-gradient(135deg,#f0fdf4,#dcfce7)}
.result-box.negative{ border-color:var(--danger); background:linear-gradient(135deg,#fef2f2,#fecaca)}
.result-box b{
  font-size:22px;
  display:block;
  margin-bottom:6px;
}
.result-box small{font-size:12px;color:var(--muted);font-weight:500}
canvas{width:100%;height:300px;border-radius:12px}
@media(max-width:900px){
  .grid{grid-template-columns:1fr;gap:20px}
  .results{grid-template-columns:repeat(2,1fr);gap:12px}
}
</style>
</head>
<body>
<h1>🏠 Rent vs Buy Calculator</h1>
<div class="container">
<div class="grid">
<!-- INPUTS -->
<div class="card">
<div class="section">
<h3>📈 Rent Details</h3>
<label>Monthly Rent ($)</label>
<input id="rent" value="1800" type="number">
<label>Annual Rent Increase (%)</label>
<input id="rentInc" value="3" type="number" step="0.1">
<label>Investment Return (%)</label>
<input id="rentInvest" value="5" type="number" step="0.1">
</div>

<div class="section">
<h3>🏠 Purchase Details</h3>
<label>Home Price ($)</label>
<input id="price" value="350000" type="number">
<label>Down Payment ($)</label>
<input id="down" value="70000" type="number">
<label>Mortgage Rate (%)</label>
<input id="rate" value="6.5" type="number" step="0.1">
<label>Loan Term (Years)</label>
<input id="term" value="30" type="number">
</div>

<div class="section">
<h3>💰 Ongoing Costs</h3>
<label>Property Tax (Annual $)</label>
<input id="tax" value="4200" type="number">
<label>Home Insurance (Annual $)</label>
<input id="ins" value="1200" type="number">
<label>Maintenance (% of home value)</label>
<input id="maint" value="1" type="number" step="0.1">
<label>Closing Costs ($)</label>
<input id="close" value="8000" type="number">
</div>

<div class="section">
<h3>📊 Growth Rates</h3>
<label>Home Appreciation (%)</label>
<input id="app" value="3" type="number" step="0.1">
<label>Analysis Period (Years)</label>
<input id="years" value="10" type="number" min="1" max="30">
<label>Currency</label>
<select id="cur">
  <option value="$">$ USD</option>
  <option value="€">€ EUR</option>
  <option value="£">£ GBP</option>
  <option value="₹">₹ INR</option>
</select>
</div>

<button class="primary" onclick="calculate()">🔄 Calculate Rent vs Buy</button>
<button class="secondary" onclick="resetForm()">↻ Reset All</button>
</div>

<!-- RESULTS -->
<div class="card">
<div class="results" id="results">
  <div class="result-box" id="rentBox"><b id="rRent">$0</b><small>Total Rent Paid</small></div>
  <div class="result-box" id="buyBox"><b id="rBuy">$0</b><small>Total Buy Cost</small></div>
  <div class="result-box" id="diffBox"><b id="rDiff">$0</b><small>Rent - Buy Savings</small></div>
  <div class="result-box" id="beBox"><b id="rBE">–</b><small>Break Even</small></div>
  
  <div class="result-box" id="eqBox"><b id="rEq">$0</b><small>Final Equity</small></div>
  <div class="result-box" id="valBox"><b id="rVal">$0</b><small>Home Value</small></div>
  <div class="result-box" id="netBox"><b id="rNet">$0</b><small>Net Worth</small></div>
  <div class="result-box" id="roiBox"><b id="rROI">0%</b><small>ROI (Total)</small></div>
</div>
<canvas id="chart"></canvas>
</div>
</div>
</div>

<script>
let chart;
function formatCurrency(num, cur = '$') {
  return cur + num.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 0});
}

function formatPercent(num) {
  return num.toFixed(1) + '%';
}

function resetForm() {
  location.reload();
}

function calculate() {
  const $ = id => parseFloat(document.getElementById(id).value) || 0;
  const cur = document.getElementById('cur').value;
  
  // Inputs
  const monthlyRent = $('rent');
  const rentInc = $('rentInc') / 100;
  const rentInvest = $('rentInvest') / 100;
  const years = Math.max(1, $('years'));
  
  const price = $('price');
  const downPayment = $('down');
  const mortgageRate = $('rate') / 100;
  const termYears = $('term');
  const annualTax = $('tax');
  const annualIns = $('ins');
  const maintPct = $('maint') / 100;
  const closingCosts = $('close');
  const homeAppreciation = $('app') / 100;
  
  // 1. Calculate Rent Scenario (with investment returns)
  let rentTotal = 0;
  let rentCumulative = [];
  let rentInvested = 0;
  let annualRent = monthlyRent;
  
  for (let year = 1; year <= years; year++) {
    const yearlyRent = annualRent * 12;
    rentTotal += yearlyRent;
    rentInvested += yearlyRent;
    rentCumulative.push(rentTotal);
    annualRent *= (1 + rentInc);
  }
  
  // Investment growth on rent money
  const rentInvestmentValue = rentInvested * Math.pow(1 + rentInvest, years);
  
  // 2. Calculate Buy Scenario
  const loanAmount = Math.max(0, price - downPayment);
  const monthlyRate = mortgageRate / 12;
  const totalPayments = termYears * 12;
  
  // Monthly mortgage payment
  const monthlyPmt = loanAmount * (monthlyRate * Math.pow(1 + monthlyRate, totalPayments)) / 
                     (Math.pow(1 + monthlyRate, totalPayments) - 1);
  
  // Simulate mortgage amortization
  let loanBalance = loanAmount;
  let totalBuyCost = downPayment + closingCosts;
  let buyCumulative = [];
  const annualOwningCosts = annualTax + annualIns + (maintPct * price);
  
  for (let month = 1; month <= years * 12; month++) {
    const interest = loanBalance * monthlyRate;
    const principal = monthlyPmt - interest;
    loanBalance = Math.max(0, loanBalance - principal);
    
    totalBuyCost += monthlyPmt;
    
    if (month % 12 === 0) {
      totalBuyCost += annualOwningCosts;
      buyCumulative.push(totalBuyCost);
    }
  }
  
  // 3. Final home value and equity
  const finalHomeValue = price * Math.pow(1 + homeAppreciation, years);
  const finalEquity = Math.max(0, finalHomeValue - loanBalance);
  
  // 4. Net worth comparisons
  const buyNetWorth = finalEquity - (totalBuyCost - downPayment - closingCosts);
  const rentNetWorth = rentInvestmentValue - rentTotal;
  const totalSavings = rentTotal - totalBuyCost;
  
  // 5. ROI calculation (total return on cash invested)
  const cashInvested = downPayment + closingCosts;
  const totalROI = cashInvested > 0 ? ((finalEquity - cashInvested) / cashInvested * 100) : 0;
  
  // 6. Break-even analysis
  let breakEvenYear = 'Never';
  for (let y = 1; y <= years; y++) {
    const rentAtY = rentCumulative[y-1];
    const buyAtY = buyCumulative[y-1];
    if (rentAtY >= buyAtY) {
      breakEvenYear = `Year ${y}`;
      break;
    }
  }
  
  // 7. Update display
  document.getElementById('rRent').textContent = formatCurrency(rentTotal, cur);
  document.getElementById('rBuy').textContent = formatCurrency(totalBuyCost, cur);
  document.getElementById('rDiff').textContent = formatCurrency(totalSavings, cur);
  document.getElementById('rEq').textContent = formatCurrency(finalEquity, cur);
  document.getElementById('rVal').textContent = formatCurrency(finalHomeValue, cur);
  document.getElementById('rNet').textContent = formatCurrency(buyNetWorth, cur);
  document.getElementById('rROI').textContent = formatPercent(totalROI);
  document.getElementById('rBE').textContent = breakEvenYear;
  
  // Visual feedback
  const diffBox = document.getElementById('diffBox');
  diffBox.className = totalSavings >= 0 ? 'result-box positive' : 'result-box negative';
  document.getElementById('netBox').className = buyNetWorth >= rentNetWorth ? 'result-box positive' : 'result-box negative';
  
  // 8. Update chart
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('chart'), {
    type: 'line',
    data: {
      labels: Array.from({length: years}, (_, i) => `Year ${i+1}`),
      datasets: [
        {
          label: 'Rent Costs',
          data: rentCumulative,
          borderColor: '#ef4444',
          backgroundColor: 'rgba(239, 68, 68, 0.1)',
          tension: 0.4,
          fill: false
        },
        {
          label: 'Buy Costs',
          data: buyCumulative,
          borderColor: '#3b82f6',
          backgroundColor: 'rgba(59, 130, 246, 0.1)',
          tension: 0.4,
          fill: false
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'top' }
      },
      scales: {
        y: {
          beginAtZero: true,
          ticks: { callback: value => formatCurrency(value, '') }
        }
      }
    }
  });
}

// Auto-calculate on input change
document.querySelectorAll('input, select').forEach(el => {
  el.addEventListener('input', calculate);
});
calculate(); // Initial calculation
</script>
</body>
</html>
