<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rent vs Buy Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --accent:#2563eb;
  --muted:#6b7280;
  --radius:14px;
  --shadow:0 10px 30px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:var(--bg);
}
.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}
h1{
  text-align:center;
  color:var(--accent);
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}
.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:20px;
}
label{
  font-size:13px;
  color:var(--muted);
}
input,select{
  width:100%;
  padding:10px;
  margin:6px 0 14px;
  border-radius:10px;
  border:1px solid #e5e7eb;
  font-size:15px;
}
.results{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}
.result{
  background:#f8fafc;
  border-radius:12px;
  padding:14px;
  text-align:center;
}
.result h3{
  margin:0;
  color:var(--accent);
}
canvas{
  height:300px !important;
  margin-top:20px;
}
@media(max-width:900px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>
<div class="container">
<h1>Rent vs Buy Calculator</h1>

<div class="grid">

<!-- INPUT -->
<div class="card">

<label>Monthly Rent</label>
<input id="rent" type="number" value="1800">

<label>Annual Rent Increase (%)</label>
<input id="rentInc" type="number" value="3">

<label>Years</label>
<input id="years" type="number" value="10">

<hr>

<label>Home Price</label>
<input id="price" type="number" value="350000">

<label>Down Payment</label>
<input id="down" type="number" value="70000">

<label>Mortgage Rate (%)</label>
<input id="rate" type="number" value="6.5">

<label>Loan Term (Years)</label>
<input id="term" type="number" value="30">

<label>Property Tax (Annual)</label>
<input id="tax" type="number" value="4200">

<label>Insurance (Annual)</label>
<input id="ins" type="number" value="1200">

<label>Maintenance (% of price)</label>
<input id="maint" type="number" value="1">

<label>Home Appreciation (%)</label>
<input id="app" type="number" value="3">

<label>Closing Costs</label>
<input id="close" type="number" value="8000">

<label>Currency</label>
<select id="cur">
  <option value="$">$ USD</option>
  <option value="€">€ EUR</option>
  <option value="£">£ GBP</option>
</select>

</div>

<!-- OUTPUT -->
<div class="card">

<div class="results">
  <div class="result"><h3 id="oRent"></h3><small>Total Rent</small></div>
  <div class="result"><h3 id="oBuy"></h3><small>Total Buy</small></div>
  <div class="result"><h3 id="oDiff"></h3><small>Difference</small></div>
  <div class="result"><h3 id="oBE"></h3><small>Break-Even</small></div>

  <div class="result"><h3 id="oEq"></h3><small>Equity</small></div>
  <div class="result"><h3 id="oVal"></h3><small>Home Value</small></div>
  <div class="result"><h3 id="oNet"></h3><small>Net Wealth</small></div>
</div>

<canvas id="chart"></canvas>

</div>

</div>
</div>

<script>
let chart;

function money(v){
  return cur.value + Math.round(v).toLocaleString();
}

function calculate(){

  const Y = +years.value;
  const rentM = +rent.value;
  const rentInc = +rentInc.value/100;

  const priceV = +price.value;
  const downV = +down.value;
  const rateV = +rate.value/100/12;
  const termV = +term.value*12;
  const taxV = +tax.value;
  const insV = +ins.value;
  const maintV = +maint.value/100;
  const appV = +app.value/100;
  const closeV = +close.value;

  /* RENT */
  let rentTotal = 0;
  let rentArr = [];
  for(let i=0;i<Y;i++){
    rentTotal += rentM * Math.pow(1+rentInc,i) * 12;
    rentArr.push(rentTotal);
  }

  /* BUY */
  const loanStart = priceV - downV;
  const emi = loanStart * rateV / (1 - Math.pow(1+rateV,-termV));

  let loan = loanStart;
  let buyTotal = downV + closeV;
  let buyArr = [];

  for(let y=0;y<Y;y++){
    for(let m=0;m<12;m++){
      let interest = loan * rateV;
      let principal = emi - interest;
      loan = Math.max(loan - principal, 0);
    }
    buyTotal += emi*12 + taxV + insV + priceV*maintV;
    buyArr.push(buyTotal);
  }

  const homeValue = priceV * Math.pow(1+appV,Y);
  const equity = homeValue - loan;
  const net = equity - buyTotal;

  oRent.innerText = money(rentTotal);
  oBuy.innerText = money(buyTotal);
  oDiff.innerText = money(rentTotal - buyTotal);
  oEq.innerText = money(equity);
  oVal.innerText = money(homeValue);
  oNet.innerText = money(net);

  oBE.innerText = "Never";
  for(let i=0;i<Y;i++){
    if(rentArr[i] >= buyArr[i]){
      oBE.innerText = "Year " + (i+1);
      break;
    }
  }

  if(chart) chart.destroy();
  chart = new Chart(document.getElementById("chart"),{
    type:"line",
    data:{
      labels: rentArr.map((_,i)=>"Year "+(i+1)),
      datasets:[
        {label:"Rent Cost", data:rentArr, borderColor:"#ef4444", fill:false},
        {label:"Buy Cost", data:buyArr, borderColor:"#2563eb", fill:false}
      ]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false
    }
  });
}

/* AUTO-RUN */
document.querySelectorAll("input,select").forEach(el=>{
  el.addEventListener("input",calculate);
});
calculate();
</script>
</body>
</html>
