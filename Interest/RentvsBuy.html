<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rent vs Buy Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#f6f9fc;
  --card:#ffffff;
  --accent:#2563eb;
  --muted:#6b7280;
  --radius:14px;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:var(--bg);
  color:#111;
}
.container{
  max-width:1200px;
  margin:auto;
  padding:16px;
}
h1{
  text-align:center;
  color:var(--accent);
  margin-bottom:20px;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}
.card{
  background:var(--card);
  border-radius:var(--radius);
  padding:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.06);
}
label{
  font-size:13px;
  color:#444;
}
input,select{
  width:100%;
  padding:10px;
  margin:6px 0 14px;
  border-radius:8px;
  border:1px solid #e5e7eb;
  font-size:14px;
}
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  font-size:15px;
  cursor:pointer;
}
.primary{background:var(--accent);color:#fff}
.secondary{background:#eef2ff;color:#1e3a8a;margin-top:8px}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}
.stat{
  background:#f8fafc;
  border-radius:10px;
  padding:12px;
  text-align:center;
}
.stat strong{display:block;font-size:18px}

canvas{margin-top:16px;max-height:280px}

@media(max-width:900px){
  .grid{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>
<div class="container">
<h1>Rent vs Buy Calculator</h1>

<div class="grid">
<!---------------- LEFT ---------------->
<div class="card">
<h3>Rent Details</h3>

<label>Monthly Rent</label>
<input id="rent" value="1800">

<label>Annual Rent Increase (%)</label>
<input id="rentInc" value="3">

<label>Years Renting</label>
<input id="years" value="10">

<hr>

<h3>Buy Details</h3>

<label>Home Price</label>
<input id="price" value="350000">

<label>Down Payment</label>
<input id="down" value="70000">

<label>Mortgage Rate (%)</label>
<input id="rate" value="6.5">

<label>Loan Term (Years)</label>
<input id="term" value="30">

<label>Property Tax (Annual)</label>
<input id="tax" value="4200">

<label>Insurance (Annual)</label>
<input id="insurance" value="1200">

<label>Maintenance (% of price)</label>
<input id="maintenance" value="1">

<label>Home Appreciation (%)</label>
<input id="appreciation" value="3">

<label>Closing Costs</label>
<input id="closing" value="8000">

<label>Currency</label>
<select id="currency">
<option value="$">$ USD</option>
<option value="€">€ EUR</option>
<option value="£">£ GBP</option>
</select>

<button class="primary" onclick="calculate()">Compare Rent vs Buy</button>
<button class="secondary" onclick="resetAll()">Clear</button>
</div>

<!---------------- RIGHT ---------------->
<div class="card">
<div class="stats">
<div class="stat"><strong id="rTotal">$0</strong>Total Rent</div>
<div class="stat"><strong id="bTotal">$0</strong>Total Buy</div>
<div class="stat"><strong id="diff">$0</strong>Difference</div>
<div class="stat"><strong id="break">—</strong>Break-Even</div>

<div class="stat"><strong id="equity">$0</strong>Equity</div>
<div class="stat"><strong id="home">$0</strong>Home Value</div>
<div class="stat"><strong id="net">$0</strong>Net Wealth</div>
<div class="stat"><strong id="roi">0%</strong>IRR</div>
</div>

<canvas id="chart"></canvas>
</div>
</div>
</div>

<script>
let chart;

function money(v){
  const s=document.getElementById("currency").value;
  return s+Math.round(v).toLocaleString();
}

function calculate(){
  const rent=+rent.value,
        inc=+rentInc.value/100,
        yrs=+years.value,
        price=+price.value,
        down=+down.value,
        rate=+rate.value/100/12,
        term=+term.value*12,
        tax=+tax.value,
        ins=+insurance.value,
        maint=+maintenance.value/100,
        appr=+appreciation.value/100,
        close=+closing.value;

  // RENT
  let totalRent=0, r=rent;
  for(let i=0;i<yrs;i++){
    totalRent+=r*12;
    r*=1+inc;
  }

  // MORTGAGE
  const loan=price-down;
  const emi=loan*rate*Math.pow(1+rate,term)/(Math.pow(1+rate,term)-1);
  const paid=emi*12*yrs;
  const owning=paid + tax*yrs + ins*yrs + price*maint*yrs + close;

  // HOME VALUE & EQUITY
  const homeVal=price*Math.pow(1+appr,yrs);
  const balance=loan*(1-Math.min(yrs*12/term,1));
  const equityVal=homeVal-balance;

  const netWealth=equityVal-owning+totalRent;
  const irr=((netWealth/down)/yrs*100)||0;

  rTotal.textContent=money(totalRent);
  bTotal.textContent=money(owning);
  diff.textContent=money(totalRent-owning);
  equity.textContent=money(equityVal);
  home.textContent=money(homeVal);
  net.textContent=money(netWealth);
  roi.textContent=irr.toFixed(1)+"%";
  break.textContent=totalRent>owning?"Year "+yrs:"Never";

  drawChart(totalRent,owning,yrs);
}

function drawChart(rentTotal,buyTotal,yrs){
  const labels=[],rData=[],bData=[];
  for(let i=1;i<=yrs;i++){
    labels.push("Year "+i);
    rData.push(rentTotal*i/yrs);
    bData.push(buyTotal*i/yrs);
  }
  if(chart)chart.destroy();
  chart=new Chart(chart,{
    type:"line",
    data:{
      labels,
      datasets:[
        {label:"Rent Cost",data:rData,borderColor:"#ef4444",fill:false},
        {label:"Buy Cost",data:bData,borderColor:"#2563eb",fill:false}
      ]
    }
  });
}

function resetAll(){
  document.querySelectorAll("input").forEach(i=>i.value="");
  document.querySelectorAll("strong").forEach(s=>s.textContent="$0");
  if(chart)chart.destroy();
}
</script>
</body>
</html>
