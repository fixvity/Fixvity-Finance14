<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rent vs Buy Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Inter,Arial;background:#f5f7fb;margin:0}
.container{max-width:1200px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
h1{text-align:center;color:#2563eb}
label{display:block;margin-top:14px;font-size:14px}
input,select{width:100%;padding:12px;margin-top:6px;border-radius:10px;border:1px solid #ddd}
button{width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;cursor:pointer}
.primary{background:#2563eb;color:#fff;margin-top:20px}
.secondary{background:#eef2ff;margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:#f8fafc;padding:14px;border-radius:12px;text-align:center}
.stat b{font-size:18px;color:#2563eb}
.print{margin-top:20px}
@media(max-width:900px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<div class="container">
<h1>Rent vs Buy Calculator</h1>

<div class="grid">

<!-- INPUT -->
<div class="card">
<h3>Rent Details</h3>
<label>Monthly Rent</label>
<input id="rent" value="1800">
<label>Annual Rent Increase (%)</label>
<input id="rentInc" value="3">
<label>Years Renting</label>
<input id="years" value="10">

<hr>

<h3>Buy Details</h3>
<label>Home Price</label>
<input id="price" value="350000">
<label>Down Payment</label>
<input id="down" value="70000">
<label>Mortgage Rate (%)</label>
<input id="rate" value="6.5">
<label>Loan Term (Years)</label>
<input id="term" value="30">
<label>Property Tax (Annual)</label>
<input id="tax" value="4200">
<label>Insurance (Annual)</label>
<input id="ins" value="1200">
<label>Maintenance (% of price)</label>
<input id="maint" value="1">
<label>Home Appreciation (%)</label>
<input id="app" value="3">
<label>Closing Costs</label>
<input id="close" value="8000">

<button class="primary" onclick="calc()">Compare Rent vs Buy</button>
<button class="secondary" onclick="location.reload()">Clear</button>
</div>

<!-- RESULTS -->
<div class="card">
<div class="stats">
<div class="stat"><b id="rentTotal">—</b><div>Total Rent Cost</div></div>
<div class="stat"><b id="buyTotal">—</b><div>Total Buy Cost</div></div>
<div class="stat"><b id="diff">—</b><div>Difference</div></div>
<div class="stat"><b id="break">—</b><div>Break-Even Year</div></div>
</div>

<button class="secondary print" onclick="window.print()">Print Report</button>
</div>

</div>
</div>

<script>
function calc(){
const rent=+rent.value, inc=+rentInc.value/100, yrs=+years.value;
const price=+price.value, down=+down.value, r=+rate.value/100/12;
const term=+term.value*12, tax=+tax.value, ins=+ins.value;
const maint=+maint.value/100*price, app=+app.value/100, close=+close.value;

let totalRent=0;
let currentRent=rent;

for(let i=1;i<=yrs;i++){
 totalRent+=currentRent*12;
 currentRent*=1+inc;
}

const loan=price-down;
const emi=loan*r*Math.pow(1+r,term)/(Math.pow(1+r,term)-1);

let buyCost=emi*12*yrs + (tax+ins+maint)*yrs + close;
const futureValue=price*Math.pow(1+app,yrs);
buyCost-=futureValue;

let breakeven="Never";
let cumRent=0,cumBuy=close;

currentRent=rent;
for(let y=1;y<=yrs;y++){
 cumRent+=currentRent*12;
 cumBuy+=emi*12 + tax+ins+maint;
 if(cumBuy<cumRent){breakeven=y;break;}
 currentRent*=1+inc;
}

rentTotal.innerText="$"+Math.round(totalRent).toLocaleString();
buyTotal.innerText="$"+Math.round(buyCost).toLocaleString();
diff.innerText="$"+Math.round(totalRent-buyCost).toLocaleString();
break.innerText=breakeven;
}
</script>

</body>
</html>
