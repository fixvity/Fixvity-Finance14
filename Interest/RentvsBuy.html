<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rent vs Buy Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{margin:0;font-family:Inter,Arial;background:#f5f7fb}
.container{max-width:1200px;margin:auto;padding:20px}
h1{text-align:center;color:#2563eb}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.08);padding:20px}
label{font-size:13px;color:#555}
input,select,button{width:100%;padding:10px;margin:6px 0 14px;border-radius:10px;border:1px solid #ddd}
button{background:#2563eb;color:#fff;border:none}
.secondary{background:#eef2ff;color:#111}
.results{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.result{background:#f8fafc;border-radius:12px;padding:14px;text-align:center}
.result h3{margin:0;color:#2563eb}
canvas{margin-top:20px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style>
</head>

<body>
<div class="container">
<h1>Rent vs Buy Calculator</h1>

<div class="grid">
<div class="card">

<label>Monthly Rent</label><input id="rent" value="1800">
<label>Annual Rent Increase (%)</label><input id="rentInc" value="3">
<label>Years Renting</label><input id="years" value="10">

<hr>

<label>Home Price</label><input id="price" value="350000">
<label>Down Payment</label><input id="down" value="70000">
<label>Mortgage Rate (%)</label><input id="rate" value="6.5">
<label>Loan Term (Years)</label><input id="term" value="30">
<label>Property Tax (Annual)</label><input id="tax" value="4200">
<label>Insurance (Annual)</label><input id="ins" value="1200">
<label>Maintenance (% of price)</label><input id="maint" value="1">
<label>Home Appreciation (%)</label><input id="app" value="3">
<label>Closing Costs</label><input id="close" value="8000">

<label><input type="checkbox" id="deduct" checked> Apply US Mortgage Tax Deduction</label>
<label>Marginal Tax Rate (%)</label><input id="taxRate" value="24">

<label>Currency</label>
<select id="cur">
<option value="$">$ USD</option>
<option value="€">€ EUR</option>
<option value="£">£ GBP</option>
</select>

<button onclick="calculate()">Compare Rent vs Buy</button>
<button class="secondary" onclick="location.reload()">Clear</button>

</div>

<div class="card">
<div class="results">
<div class="result"><h3 id="rentCost">$0</h3><span>Total Rent</span></div>
<div class="result"><h3 id="buyCost">$0</h3><span>Total Buy</span></div>
<div class="result"><h3 id="diff">$0</h3><span>Difference</span></div>
<div class="result"><h3 id="breakEven">–</h3><span>Break-Even</span></div>

<div class="result"><h3 id="equity">$0</h3><span>Equity Built</span></div>
<div class="result"><h3 id="homeValue">$0</h3><span>Home Value</span></div>
<div class="result"><h3 id="netWorth">$0</h3><span>Net Wealth</span></div>
<div class="result"><h3 id="irr">$0</h3><span>IRR</span></div>
</div>

<canvas id="chart"></canvas>
<button class="secondary" onclick="window.print()">Print Report</button>
</div>
</div>
</div>

<script>
function f(v){
 return document.getElementById("cur").value +
 Math.round(v).toLocaleString();
}

function calculate(){
 const years = +yearsEl();
 function yearsEl(){return document.getElementById("years").value}

 const rent = +rentEl();
 function rentEl(){return document.getElementById("rent").value}

 const inc = +rentInc.value/100;

 let rentTotal=0;
 let rentArr=[];
 for(let i=0;i<years;i++){
  rentTotal+=rent*Math.pow(1+inc,i)*12;
  rentArr.push(rentTotal);
 }

 const loan = price.value - down.value;
 const r = rate.value/100/12;
 const n = term.value*12;
 const emi = loan*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);

 let bal=loan, interest=0;
 for(let i=0;i<years*12;i++){
  let int=bal*r;
  interest+=int;
  bal-=emi-int;
 }

 const maintCost = price.value*(maint.value/100)*years;
 let buyTotal = emi*12*years + tax.value*years + ins.value*years + maintCost + +close.value;

 if(deduct.checked){
  buyTotal -= (interest + tax.value*years)*(taxRate.value/100);
 }

 const homeVal = price.value*Math.pow(1+app.value/100,years);
 const equity = homeVal - bal;
 const net = equity - buyTotal;

 rentCost.innerText=f(rentTotal);
 buyCost.innerText=f(buyTotal);
 diff.innerText=f(rentTotal-buyTotal);
 equity.innerText=f(equity);
 homeValue.innerText=f(homeVal);
 netWorth.innerText=f(net);

 let be="Never";
 for(let i=0;i<years;i++){
  if(rentArr[i]>=buyTotal){be="Year "+(i+1);break}
 }
 breakEven.innerText=be;

 if(window.c)window.c.destroy();
 window.c=new Chart(chart,{
  type:"line",
  data:{
   labels:rentArr.map((_,i)=>"Year "+(i+1)),
   datasets:[
    {label:"Rent Cost",data:rentArr,borderColor:"#ef4444"},
    {label:"Buy Cost",data:Array(years).fill(buyTotal),borderColor:"#2563eb"}
   ]
  }
 });
}
</script>
</body>
</html>
